format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$fill\
$kubernetes\
$line_break\
$python\
$character"""

[fill]
symbol = " "

[hostname]
disabled = true

[username]
format = "[$user]($style): "

[directory]
style = "blue"
truncate_to_repo = false
truncation_length = 0

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[kubernetes]
disabled = false
format = "[⎈ $context]($style)"
style = "cyan"

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bright-red"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
