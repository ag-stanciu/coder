[experimental]
pane_history = false

[theme]
name = "tokyo-night"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 32
sidebar_min_width = 24
sidebar_max_width = 48

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[remote]
manage_ssh_config = false

[keys]
prefix = "ctrl+;"
goto = ["prefix+g", "ctrl+alt+g"]
# workspace
navigate_workspace_down = "j"
navigate_workspace_up = "k"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"
workspace_picker = ["prefix+w", "ctrl+alt+w"]
# tabs
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]
switch_tab = ["prefix+1..9", "alt+1..9"]

